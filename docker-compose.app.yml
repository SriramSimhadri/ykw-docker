services:

  postgres:
    image: postgres:18
    container_name: ykw-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - ykw-network

  redis:
    image: redis:7.2-alpine
    container_name: ykw-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - ykw-network

  # YKW API GATEWAY
  ykw-api-gateway:
    image: ykw-api-gateway:1.0.1
    container_name: ykw-api-gateway
    restart: always
    depends_on:
      - ykw-auth-service
      - ykw-profile-service
    ports:
      - "8080:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # OpenTelemetry
      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Dotel.service.name=ykw-api-gateway
        -Dotel.exporter.otlp.endpoint=http://otel-collector:4317
        -Dotel.exporter.otlp.protocol=grpc
        -Dotel.traces.exporter=otlp
        -Dotel.metrics.exporter=otlp
        -Dotel.logs.exporter=otlp
        -Dotel.instrumentation.logback-mdc.enabled=true

    # correlate with traces 
        
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Downstream services
      AUTH_SERVICE_URL: http://ykw-auth-service:8090
      PROFILE_SERVICE_URL: http://ykw-profile-service:8091
      ARTICLE_SERVICE_URL: http://ykw-article-service:8092
      LIKES_SERVICE_URL: http://ykw-likes-service:8093
      COMMENTS_SERVICE_URL: http://ykw-comments-service:8094
      FOLLOWS_SERVICE_URL: http://ykw-follows-service:8095

    volumes:
      - ./logs:/app/logs
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar

    networks:
      - ykw-network

  # YKW AUTH SERVICE 
  ykw-auth-service:
    image: ykw-auth-service:1.0.1
    container_name: ykw-auth-service
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # OpenTelemetry
      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Dotel.service.name=ykw-auth-service
        -Dotel.exporter.otlp.endpoint=http://otel-collector:4317
        -Dotel.exporter.otlp.protocol=grpc
        -Dotel.traces.exporter=otlp
        -Dotel.metrics.exporter=otlp
        -Dotel.logs.exporter=otlp
        -Dotel.instrumentation.logback-mdc.enabled=true

      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USER: postgres
      DB_PASSWORD: postgres

      REDIS_HOST: redis
      REDIS_PORT: 6379

      AUTH_SERVICE_URL: http://ykw-auth-service:8090
      INTERNAL_TOKEN: ${GATEWAY_SECRET_ONLY}

    volumes:
      - ./logs:/app/logs
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar

    networks:
      - ykw-network

  ykw-profile-service:
    image: ykw-profile-service:1.0.1
    container_name: ykw-profile-service
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # OpenTelemetry
      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Dotel.service.name=ykw-profile-service
        -Dotel.exporter.otlp.endpoint=http://otel-collector:4317
        -Dotel.exporter.otlp.protocol=grpc
        -Dotel.traces.exporter=otlp
        -Dotel.metrics.exporter=otlp
        -Dotel.logs.exporter=otlp
        -Dotel.instrumentation.logback-mdc.enabled=true
                
      DB_URL: jdbc:postgresql://postgres:5432/profile_db
      DB_USER: postgres
      DB_PASSWORD: postgres
  
      REDIS_HOST: redis
      REDIS_PORT: 6379

      AUTH_SERVICE_URL: http://ykw-auth-service:8090

    volumes:
      - ./logs:/app/logs
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar

    networks:
      - ykw-network

volumes:
  pgdata:
  redisdata:

networks:
  ykw-network:
    driver: bridge