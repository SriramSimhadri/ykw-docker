services:

  postgres:
    image: postgres:18
    container_name: ykw-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - ykw-network

  redis:
    image: redis:7.2-alpine
    container_name: ykw-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - ykw-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ykw-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      # KRaft mode
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1

      # Controller quorum
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@ykw-kafka:9093

      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://ykw-kafka:9092

      # Required configs
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Storage
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Single-node dev settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Cluster ID (REQUIRED)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - ykw-network

  # YKW API GATEWAY
  ykw-api-gateway:
    image: ghcr.io/sriramsimhadri/ykw-api-gateway:latest
    container_name: ykw-api-gateway
    restart: always
    depends_on:
      - ykw-auth-service
      - ykw-profile-service
    ports:
      - "8080:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # OpenTelemetry
      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Dotel.service.name=ykw-api-gateway
        -Dotel.exporter.otlp.endpoint=http://otel-collector:4317
        -Dotel.exporter.otlp.protocol=grpc
        -Dotel.traces.exporter=otlp
        -Dotel.metrics.exporter=otlp
        -Dotel.logs.exporter=otlp
        -Dotel.instrumentation.logback-mdc.enabled=true

    # correlate with traces 
        
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Downstream services
      AUTH_SERVICE_URL: http://ykw-auth-service:8090
      PROFILE_SERVICE_URL: http://ykw-profile-service:8091
      ARTICLE_SERVICE_URL: http://ykw-article-service:8092
      LIKES_SERVICE_URL: http://ykw-likes-service:8093
      COMMENTS_SERVICE_URL: http://ykw-comments-service:8094
      FOLLOWS_SERVICE_URL: http://ykw-follows-service:8095
      OTEL_METRICS_URL: http://otel-collector:4318/v1/metrics

    volumes:
      - ./logs:/app/logs
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar

    networks:
      - ykw-network

  # YKW AUTH SERVICE 
  ykw-auth-service:
    image: ghcr.io/sriramsimhadri/ykw-auth-service:latest
    container_name: ykw-auth-service
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # OpenTelemetry
      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Dotel.service.name=ykw-auth-service
        -Dotel.exporter.otlp.endpoint=http://otel-collector:4317
        -Dotel.exporter.otlp.protocol=grpc
        -Dotel.traces.exporter=otlp
        -Dotel.metrics.exporter=otlp
        -Dotel.logs.exporter=otlp
        -Dotel.instrumentation.logback-mdc.enabled=true

      DB_URL: jdbc:postgresql://postgres:5432/user_db
      DB_USER: postgres
      DB_PASSWORD: postgres

      REDIS_HOST: redis
      REDIS_PORT: 6379

      AUTH_SERVICE_URL: http://ykw-auth-service:8090
      INTERNAL_TOKEN: ${GATEWAY_SECRET_ONLY}
      OTEL_METRICS_URL: http://otel-collector:4318/v1/metrics

    volumes:
      - ./logs:/app/logs
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar

    networks:
      - ykw-network

  ykw-profile-service:
    image: ghcr.io/sriramsimhadri/ykw-profile-service:latest
    container_name: ykw-profile-service
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # OpenTelemetry
      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Dotel.service.name=ykw-profile-service
        -Dotel.exporter.otlp.endpoint=http://otel-collector:4317
        -Dotel.exporter.otlp.protocol=grpc
        -Dotel.traces.exporter=otlp
        -Dotel.metrics.exporter=otlp
        -Dotel.logs.exporter=otlp
        -Dotel.instrumentation.logback-mdc.enabled=true
                
      DB_URL: jdbc:postgresql://postgres:5432/profile_db
      DB_USER: postgres
      DB_PASSWORD: postgres
  
      REDIS_HOST: redis
      REDIS_PORT: 6379

      AUTH_SERVICE_URL: http://ykw-auth-service:8090
      OTEL_METRICS_URL: http://otel-collector:4318/v1/metrics

    volumes:
      - ./logs:/app/logs
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar

    networks:
      - ykw-network

  ykw-article-service:
    image: ghcr.io/sriramsimhadri/ykw-article-service:latest
    container_name: ykw-article-service
    restart: always
    depends_on:
      - postgres
      - kafka
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # OpenTelemetry
      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Dotel.service.name=ykw-article-service
        -Dotel.exporter.otlp.endpoint=http://otel-collector:4317
        -Dotel.exporter.otlp.protocol=grpc
        -Dotel.traces.exporter=otlp
        -Dotel.metrics.exporter=otlp
        -Dotel.logs.exporter=otlp
        -Dotel.instrumentation.logback-mdc.enabled=true
                
      DB_URL: jdbc:postgresql://postgres:5432/article_db
      DB_USER: postgres
      DB_PASSWORD: postgres

      KAFKA_BROKER: ykw-kafka:9092
  
      REDIS_HOST: redis
      REDIS_PORT: 6379

      AUTH_SERVICE_URL: http://ykw-auth-service:8090
      OTEL_METRICS_URL: http://otel-collector:4318/v1/metrics

      GRPC_SERVER_URL: ykw-cache-service:9080

    volumes:
      - ./logs:/app/logs
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar

    networks:
      - ykw-network

  ykw-cache-service:
    image: ghcr.io/sriramsimhadri/ykw-cache-service:latest
    container_name: ykw-cache-service
    restart: always
    depends_on:
      - kafka
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # OpenTelemetry
      JAVA_TOOL_OPTIONS: >
        -javaagent:/otel/opentelemetry-javaagent.jar
        -Dotel.service.name=ykw-cache-service
        -Dotel.exporter.otlp.endpoint=http://otel-collector:4317
        -Dotel.exporter.otlp.protocol=grpc
        -Dotel.traces.exporter=otlp
        -Dotel.metrics.exporter=otlp
        -Dotel.logs.exporter=otlp
        -Dotel.instrumentation.logback-mdc.enabled=true

      REDIS_HOST: redis
      REDIS_PORT: 6379

      GRPC_SERVER_PORT: 9080

      OTEL_METRICS_URL: http://otel-collector:4318/v1/metrics

    volumes:
      - ./logs:/app/logs
      - ./infra/otel/opentelemetry-javaagent.jar:/otel/opentelemetry-javaagent.jar

    networks:
      - ykw-network

volumes:
  pgdata:
  redisdata:
  kafka_data:

networks:
  ykw-network:
    driver: bridge