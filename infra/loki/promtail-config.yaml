
# Log shipper
server:
  http_listen_port: 9080

# tracks how much of log file is read
positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: ykw-app
          __path__: /var/lib/docker/containers/*/*.log

    pipeline_stages:
      - regex:
          expression: '/var/logs/ykw-app/(?P<service>.*)\.log'
      - labels:
          service:
    